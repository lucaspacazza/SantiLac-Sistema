Listen 8082
<VirtualHost *:8082>
    ServerName admin-api.internal
    DocumentRoot /var/www/santilac-admin/backend/public

    <Directory /var/www/santilac-admin/backend/public>
        AllowOverride None
        Require all granted
        Options -Indexes +FollowSymLinks
        FallbackResource /index.php
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost/"
    </FilesMatch>
</VirtualHost>

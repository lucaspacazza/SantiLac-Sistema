<VirtualHost *:80>
    ServerName admin.santilac.com.br
    DocumentRoot /var/www/santilac-admin/frontend

    <Directory /var/www/santilac-admin/frontend>
        AllowOverride None
        Require all granted
        Options -Indexes +FollowSymLinks
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    Alias /modules/ /var/www/santilac-admin/modules/
    <Directory /var/www/santilac-admin/modules>
        Require all granted
        Options -Indexes
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api/ http://192.168.5.202:8082/api/
    ProxyPassReverse /api/ http://192.168.5.202:8082/api/

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
</VirtualHost>

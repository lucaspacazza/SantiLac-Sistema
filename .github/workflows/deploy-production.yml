name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      frontend:
        description: Deploy frontend
        type: boolean
        default: false
      backend:
        description: Deploy backend
        type: boolean
        default: false 
      processor:
        description: Deploy processor
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      backend: ${{ steps.detect.outputs.backend }}
      processor: ${{ steps.detect.outputs.processor }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "frontend=${{ inputs.frontend }}" >> "$GITHUB_OUTPUT"
            echo "backend=${{ inputs.backend }}" >> "$GITHUB_OUTPUT"
            echo "processor=${{ inputs.processor }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "frontend=true" >> "$GITHUB_OUTPUT"
          echo "backend=true" >> "$GITHUB_OUTPUT"
          echo "processor=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy production
    needs: detect
    if: |
      needs.detect.outputs.frontend == 'true' ||
      needs.detect.outputs.backend == 'true' ||
      needs.detect.outputs.processor == 'true'
    runs-on: [self-hosted, santilac-prod]
    environment: production
    env:
      FRONTEND_CT: "100"
      FRONTEND_PATH: /var/www/santilac-front
      BACKEND_CT: "101"
      BACKEND_PATH: /var/www/santilac-backend
      PROCESSOR_CT: "102"
      PROCESSOR_PATH: /var/www/processor
      PROCESSOR_INSTALL_REQUIREMENTS: "1"
      PROCESSOR_SERVICES: "santilac-processor.service"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        if: needs.detect.outputs.frontend == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Assert production deploy targets
        run: |
          set -euo pipefail
          test "$FRONTEND_CT" = "100"
          test "$BACKEND_CT" = "101"
          test "$PROCESSOR_CT" = "102"

      - name: Validate deploy configuration
        run: bash deploy/scripts/validate-config.sh
        env:
          DEPLOY_FRONTEND: ${{ needs.detect.outputs.frontend }}
          DEPLOY_BACKEND: ${{ needs.detect.outputs.backend }}
          DEPLOY_PROCESSOR: ${{ needs.detect.outputs.processor }}

      - name: Prepare backend
        if: needs.detect.outputs.backend == 'true'
        run: bash deploy/scripts/prepare-backend.sh

      - name: Deploy backend
        if: needs.detect.outputs.backend == 'true'
        run: bash deploy/scripts/publish-backend.sh
        env:
          BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}

      - name: Prepare processor
        if: needs.detect.outputs.processor == 'true'
        run: bash deploy/scripts/prepare-processor.sh

      - name: Deploy processor
        if: needs.detect.outputs.processor == 'true'
        run: bash deploy/scripts/publish-processor.sh
        env:
          PROCESSOR_HEALTH_URL: ${{ vars.PROCESSOR_HEALTH_URL }}

      - name: Prepare frontend
        if: needs.detect.outputs.frontend == 'true'
        run: bash deploy/scripts/prepare-frontend.sh

      - name: Deploy frontend
        if: needs.detect.outputs.frontend == 'true'
        run: bash deploy/scripts/publish-frontend.sh
        env:
          FRONTEND_HEALTH_URL: ${{ vars.FRONTEND_HEALTH_URL }}

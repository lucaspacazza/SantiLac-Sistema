name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      frontend:
        description: Deploy frontend
        type: boolean
        default: false
      backend:
        description: Deploy backend
        type: boolean
        default: false 
      pwa_backend:
        description: Deploy backend PWA producao
        type: boolean
        default: false
      processor:
        description: Deploy processor
        type: boolean
        default: false
      admin:
        description: Deploy subsistema admin
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      backend: ${{ steps.detect.outputs.backend }}
      pwa_backend: ${{ steps.detect.outputs.pwa_backend }}
      processor: ${{ steps.detect.outputs.processor }}
      admin: ${{ steps.detect.outputs.admin }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "frontend=${{ inputs.frontend }}" >> "$GITHUB_OUTPUT"
            echo "backend=${{ inputs.backend }}" >> "$GITHUB_OUTPUT"
            echo "pwa_backend=${{ inputs.pwa_backend }}" >> "$GITHUB_OUTPUT"
            echo "processor=${{ inputs.processor }}" >> "$GITHUB_OUTPUT"
            echo "admin=${{ inputs.admin }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [ -n "$base" ]; then
            changed="$(git diff --name-only "$base" HEAD)"
          else
            changed="$(git ls-files)"
          fi
          echo "$changed"

          has_change() {
            printf '%s\n' "$changed" | grep -E "$1" >/dev/null 2>&1
          }

          if has_change '^(.github/workflows/deploy-production\.yml|deploy/)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "pwa_backend=true" >> "$GITHUB_OUTPUT"
            echo "processor=true" >> "$GITHUB_OUTPUT"
            echo "admin=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if has_change '^(frontend/|pwa-producao/frontend/)'; then echo "frontend=true" >> "$GITHUB_OUTPUT"; else echo "frontend=false" >> "$GITHUB_OUTPUT"; fi
          if has_change '^(backend/)'; then echo "backend=true" >> "$GITHUB_OUTPUT"; else echo "backend=false" >> "$GITHUB_OUTPUT"; fi
          if has_change '^(pwa-producao/backend/)'; then echo "pwa_backend=true" >> "$GITHUB_OUTPUT"; else echo "pwa_backend=false" >> "$GITHUB_OUTPUT"; fi
          if has_change '^(processor/)'; then echo "processor=true" >> "$GITHUB_OUTPUT"; else echo "processor=false" >> "$GITHUB_OUTPUT"; fi
          if has_change '^(admin/)'; then echo "admin=true" >> "$GITHUB_OUTPUT"; else echo "admin=false" >> "$GITHUB_OUTPUT"; fi

  deploy:
    name: Deploy production
    needs: detect
    if: |
      needs.detect.outputs.frontend == 'true' ||
      needs.detect.outputs.backend == 'true' ||
      needs.detect.outputs.pwa_backend == 'true' ||
      needs.detect.outputs.processor == 'true' ||
      needs.detect.outputs.admin == 'true'
    runs-on: [self-hosted, santilac-prod]
    environment: production
    env:
      FRONTEND_CT: "100"
      FRONTEND_PATH: /var/www/santilac-front
      BACKEND_CT: "101"
      BACKEND_PATH: /var/www/santilac-backend
      PWA_PRODUCAO_BACKEND_CT: "101"
      PWA_PRODUCAO_BACKEND_PATH: /var/www/santilac-pwa-producao-backend
      PROCESSOR_CT: "102"
      PROCESSOR_PATH: /var/www/processor
      PROCESSOR_INSTALL_REQUIREMENTS: "1"
      PROCESSOR_SERVICES: "santilac-processor.service"
      ADMIN_FRONTEND_CT: "100"
      ADMIN_BACKEND_CT: "101"
      ADMIN_PATH: /var/www/santilac-admin
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        if: needs.detect.outputs.frontend == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            pwa-producao/frontend/package-lock.json

      - name: Assert production deploy targets
        run: |
          set -euo pipefail
          test "$FRONTEND_CT" = "100"
          test "$BACKEND_CT" = "101"
          test "$PWA_PRODUCAO_BACKEND_CT" = "101"
          test "$PROCESSOR_CT" = "102"
          test "$ADMIN_FRONTEND_CT" = "100"
          test "$ADMIN_BACKEND_CT" = "101"

      - name: Validate deploy configuration
        run: bash deploy/scripts/validate-config.sh
        env:
          DEPLOY_FRONTEND: ${{ needs.detect.outputs.frontend }}
          DEPLOY_BACKEND: ${{ needs.detect.outputs.backend }}
          DEPLOY_PWA_PRODUCAO_BACKEND: ${{ needs.detect.outputs.pwa_backend }}
          DEPLOY_PROCESSOR: ${{ needs.detect.outputs.processor }}
          DEPLOY_ADMIN: ${{ needs.detect.outputs.admin }}

      - name: Prepare backend
        if: needs.detect.outputs.backend == 'true'
        run: bash deploy/scripts/prepare-backend.sh

      - name: Deploy backend
        if: needs.detect.outputs.backend == 'true'
        run: bash deploy/scripts/publish-backend.sh
        env:
          BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}

      - name: Prepare PWA producao backend
        if: needs.detect.outputs.pwa_backend == 'true'
        run: bash deploy/scripts/prepare-pwa-producao-backend.sh

      - name: Deploy PWA producao backend
        if: needs.detect.outputs.pwa_backend == 'true'
        run: bash deploy/scripts/publish-pwa-producao-backend.sh
        env:
          PWA_PRODUCAO_BACKEND_HEALTH_URL: ${{ vars.PWA_PRODUCAO_BACKEND_HEALTH_URL }}

      - name: Prepare processor
        if: needs.detect.outputs.processor == 'true'
        run: bash deploy/scripts/prepare-processor.sh

      - name: Deploy processor
        if: needs.detect.outputs.processor == 'true'
        run: bash deploy/scripts/publish-processor.sh
        env:
          PROCESSOR_HEALTH_URL: ${{ vars.PROCESSOR_HEALTH_URL }}

      - name: Prepare frontend
        if: needs.detect.outputs.frontend == 'true'
        run: bash deploy/scripts/prepare-frontend.sh

      - name: Deploy frontend
        if: needs.detect.outputs.frontend == 'true'
        run: bash deploy/scripts/publish-frontend.sh
        env:
          FRONTEND_HEALTH_URL: ${{ vars.FRONTEND_HEALTH_URL }}

      - name: Prepare admin
        if: needs.detect.outputs.admin == 'true'
        run: bash deploy/scripts/prepare-admin.sh

      - name: Deploy admin
        if: needs.detect.outputs.admin == 'true'
        run: bash deploy/scripts/publish-admin.sh
        env:
          ADMIN_HEALTH_URL: ${{ vars.ADMIN_HEALTH_URL }}
